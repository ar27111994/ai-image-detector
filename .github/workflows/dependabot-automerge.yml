name: Dependabot auto-merge

# Auto-merge Dependabot PRs only when every gate passes. The ORT version-coupling assertion in
# build.mjs (npm run build) makes an incompatible onnxruntime bump fail the build job, so a bad
# dependency update can never be merged green.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: windows-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge (squash) once required checks are green
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              auto_merge: { merge_method: 'squash' },
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
