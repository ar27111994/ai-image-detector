name: Dependabot auto-merge

# Auto-merge Dependabot PRs only when every gate passes. The ORT version-coupling assertion in
# build.mjs (npm run build) makes an incompatible onnxruntime bump fail the build job, so a bad
# dependency update can never be merged green.

# pull_request_target: this workflow runs in the BASE repo's trust context (needed for the
# auto-merge GraphQL mutation — pull_request gets a read-only token for Dependabot PRs). It never
# checks out or executes PR code; it only toggles auto-merge on the PR. Safe per GitHub guidance.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: windows-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge (squash) once required checks are green
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // pulls.update has no auto_merge param (that step silently no-ops). Auto-merge is
            // enabled via the GraphQL enablePullRequestAutoMerge mutation.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const nodeId = pr.data.node_id;
            await github.graphql(
              `mutation($prId: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: SQUASH }) {
                  pullRequest { autoMergeRequest { enabledAt mergeMethod } }
                }
              }`,
              { prId: nodeId },
            );
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
