name: Dependency Review

# Block PRs that introduce a vulnerable or newly-licensed dependency. Complements the CI
# security job (which audits the committed lockfile) by reviewing the *diff* of a PR — catching
# a bad bump before it lands. Uses the shipped GitHub dependency-review-action.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency review (fail on high+ severity or a denied license)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The extension is MIT; do not allow copyleft/proprietary deps to be introduced.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
