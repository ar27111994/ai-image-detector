# Dependabot: keep dependencies current (security + maintenance gate).
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ['dependencies']
    # onnxruntime-web/-node update together (dependabot groups below). The build asserts the
    # web/node versions match and the vendored wasm files exist, so a bad ORT bump fails CI and
    # will not auto-merge.
    groups:
      onnxruntime:
        patterns: ['onnxruntime-web', 'onnxruntime-node']
      vitest:
        patterns: ['vitest', '@vitest/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-*']
    # vitest 4.x is a major with breaking async/observer flushing semantics; it fails
    # tests/unit/content.test.js (image-discovery assertions). Ignore >=4 until a deliberate
    # migration. Vitest + @vitest/coverage-v8 still update together (group above) on 3.x.
    ignore:
      - dependency-name: 'vitest'
        versions: ['>=4']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=4']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels: ['ci']
    # codeql-action init/analyze must change version together (a mismatch fails the
    # CodeQL analyze step with "Loaded config for X, running Y"), so group every
    # github/codeql-action/* update into one PR.
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'

  # Python tooling used for model conversion/quantization (tools/*.py). These are dev-only
  # (never shipped in the extension) but are kept current for reproducibility + supply-chain
  # hygiene.
  - package-ecosystem: pip
    directory: '/tools'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ['dependencies', 'tooling']
